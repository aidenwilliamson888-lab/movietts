<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie TTS Generator V2</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #0f1117;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .box {
      background: #181c25;
      border: 1px solid #292f3a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea,
    input,
    select {
      width: 100%;
      background: #0f1117;
      color: white;
      border: 1px solid #343b48;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #667eea;
    }

    .field {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #667eea;
      color: white;
    }

    button:hover {
      background: #5568d8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #0b0d12;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #667eea;
      transition: width 0.3s;
    }

    .status {
      margin-top: 10px;
      color: #aeb6c5;
      font-size: 14px;
    }

    .movie {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #292f3a;
    }

    .movie:last-child {
      border-bottom: none;
    }

    .poster {
      width: 70px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      background: #252a34;
    }

    .movie-info {
      flex: 1;
    }

    .movie-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .movie-meta {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .narration {
      color: #d1d5db;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .small {
      font-size: 12px;
      color: #8b93a1;
      margin-top: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Movie TTS Generator V2</h1>

  <div class="subtitle">
    TMDB → Metadata → Indonesian TTS → MP3 ZIP
  </div>

  <div class="box">

    <div class="field">
      <label>TMDB Movie IDs</label>

      <textarea
        id="tmdbIds"
        placeholder="Contoh:
550
238
680
278
13
155
497
603
27205
157336"
      ></textarea>

      <div class="small">
        Maksimal 100 TMDB ID per proses.
      </div>
    </div>


    <div class="field">

      <label>ElevenLabs Voice ID</label>

      <input
        id="voiceId"
        type="text"
        placeholder="Masukkan Voice ID ElevenLabs"
        value="hpp4J3VqNfWAUOO0d1Us"
      >

      <div class="small">
        Voice ID diambil dari voice yang tersedia di akun ElevenLabs kamu.
      </div>

    </div>


    <div class="field">

      <label>TTS Model</label>

      <select id="model">

        <option value="eleven_multilingual_v2">
          Eleven Multilingual v2
        </option>

      </select>

    </div>


    <div class="field">

      <label>MP3 Quality</label>

      <select id="format">

        <option value="mp3_22050_32">
          MP3 22.05 kHz / 32 kbps — Small
        </option>

        <option value="mp3_44100_64">
          MP3 44.1 kHz / 64 kbps
        </option>

        <option value="mp3_44100_96">
          MP3 44.1 kHz / 96 kbps
        </option>

        <option value="mp3_44100_128">
          MP3 44.1 kHz / 128 kbps
        </option>

      </select>

    </div>


    <div class="field">

      <label>Narration Template</label>

      <textarea id="template">Selamat datang di Movie Review. Hari ini kita membahas film {TITLE}, yang dirilis pada tahun {YEAR}. Jangan lupa subscribe untuk movie review terbaru.</textarea>

      <div class="small">
        Variable tersedia: {TITLE}, {YEAR}, {GENRE}, {DIRECTOR}, {RATING}
      </div>

    </div>


    <button id="generateBtn" onclick="generateAll()">
      🚀 Generate MP3
    </button>

    <div class="progress">
      <div
        id="progressBar"
        class="progress-bar"
      ></div>
    </div>

    <div
      id="status"
      class="status"
    >
      Ready.
    </div>

  </div>


  <div class="box">

    <h2>Results</h2>

    <div id="results"></div>

  </div>

</div>


<script>

function getIds() {

  const raw =
    document.getElementById("tmdbIds").value;

  const ids = raw
    .split(/[\s,;]+/)
    .map(x => x.trim())
    .filter(Boolean);

  return [...new Set(ids)];
}


function slugify(text) {

  return text
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .substring(0, 100);

}


function buildNarration(movie) {

  const template =
    document.getElementById("template").value;

  return template
    .replaceAll("{TITLE}", movie.title || "")
    .replaceAll("{YEAR}", movie.year || "")
    .replaceAll("{GENRE}", movie.genres || "")
    .replaceAll("{DIRECTOR}", movie.director || "")
    .replaceAll(
      "{RATING}",
      movie.rating != null
        ? Number(movie.rating).toFixed(1)
        : ""
    );

}


function setProgress(current, total) {

  const percentage =
    total > 0
      ? Math.round((current / total) * 100)
      : 0;

  document.getElementById(
    "progressBar"
  ).style.width = percentage + "%";

  document.getElementById(
    "status"
  ).textContent =
    `${current} / ${total} selesai (${percentage}%)`;

}


async function getMovie(id) {

  const response =
    await fetch(
      `/api/movie?id=${encodeURIComponent(id)}`
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error ||
      `TMDB error ${response.status}`
    );

  }

  return data;

}


async function generateSpeech(
  text,
  voiceId,
  modelId,
  outputFormat
) {

  const response =
    await fetch("/api/tts", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        text,
        voiceId,
        modelId,
        outputFormat

      })

    });


  if (!response.ok) {

    let message =
      `TTS error ${response.status}`;

    try {

      const data =
        await response.json();

      message =
        data.error || message;

    } catch (_) {}

    throw new Error(message);

  }


  return await response.blob();

}


function addResult(
  movie,
  narration,
  status,
  error = ""
) {

  const results =
    document.getElementById("results");

  const div =
    document.createElement("div");

  div.className = "movie";

  div.innerHTML = `

    ${
      movie.poster
        ? `<img class="poster" src="${movie.poster}" alt="">`
        : `<div class="poster"></div>`
    }

    <div class="movie-info">

      <div class="movie-title">
        ${escapeHtml(movie.title)}
      </div>

      <div class="movie-meta">
        ${movie.year || "-"}
        ${movie.genres ? " • " + escapeHtml(movie.genres) : ""}
        ${movie.rating != null ? " • ⭐ " + movie.rating : ""}
      </div>

      <div class="narration">
        ${escapeHtml(narration)}
      </div>

      <div class="${status === "success" ? "success" : "error"}">
        ${
          status === "success"
            ? "✓ MP3 berhasil dibuat"
            : "✕ " + escapeHtml(error)
        }
      </div>

    </div>
  `;

  results.appendChild(div);

}


function escapeHtml(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


async function generateAll() {

  const button =
    document.getElementById("generateBtn");

  const ids =
    getIds();

  const voiceId =
    document.getElementById("voiceId")
      .value
      .trim();

  const modelId =
    document.getElementById("model")
      .value;

  const outputFormat =
    document.getElementById("format")
      .value;


  if (!ids.length) {

    alert("Masukkan minimal 1 TMDB ID.");

    return;

  }


  if (ids.length > 100) {

    alert(
      "Maksimal 100 TMDB ID per proses."
    );

    return;

  }


  if (
    !voiceId ||
    voiceId === "YOUR_VOICE_ID_HERE"
  ) {

    alert(
      "Masukkan Voice ID ElevenLabs terlebih dahulu."
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Generating...";


  document.getElementById(
    "results"
  ).innerHTML = "";


  document.getElementById(
    "progressBar"
  ).style.width = "0%";


  const zip =
    new JSZip();


  let successCount = 0;
  let errorCount = 0;


  for (
    let i = 0;
    i < ids.length;
    i++
  ) {

    const id = ids[i];

    setProgress(i, ids.length);

    try {

      const movie =
        await getMovie(id);


      const narration =
        buildNarration(movie);


      const blob =
        await generateSpeech(
          narration,
          voiceId,
          modelId,
          outputFormat
        );


      const filename =
        `${slugify(movie.title)}-${movie.year || "unknown"}-${movie.id}.mp3`;


      zip.file(
        filename,
        blob
      );


      addResult(
        movie,
        narration,
        "success"
      );


      successCount++;


    } catch (error) {

      errorCount++;


      addResult(
        {
          title: `TMDB ID ${id}`,
          year: "",
          genres: "",
          rating: null
        },
        "",
        "error",
        error?.message || "Unknown error"
      );

    }


    setProgress(
      i + 1,
      ids.length
    );

  }


  if (successCount > 0) {

    document.getElementById(
      "status"
    ).textContent =
      `Membuat ZIP... ${successCount} MP3 berhasil, ${errorCount} gagal.`;


    const zipBlob =
      await zip.generateAsync({
        type: "blob"
      });


    const url =
      URL.createObjectURL(zipBlob);


    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      `movie-tts-${Date.now()}.zip`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  }


  document.getElementById(
    "status"
  ).textContent =
    `Selesai — ${successCount} berhasil, ${errorCount} gagal.`;


  button.disabled = false;

  button.textContent =
    "🚀 Generate MP3";

}

</script>

</body>
</html>
